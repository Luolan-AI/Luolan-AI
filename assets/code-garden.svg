<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Lan Luo's Code Garden</title>
  <desc id="desc">A decorative animated garden of dense green squares with a glowing snake moving through them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120f" />
      <stop offset="0.52" stop-color="#081b16" />
      <stop offset="1" stop-color="#091522" />
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" />
      <stop offset="0.55" stop-color="#7ee787" />
      <stop offset="1" stop-color="#b6f7c2" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.3" />
      <stop offset="1" stop-color="#39d353" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="headGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="garden" width="110" height="110" patternUnits="userSpaceOnUse">
      <g rx="4">
        <rect x="3" y="3" width="16" height="16" rx="4" fill="#0e4429" />
        <rect x="25" y="3" width="16" height="16" rx="4" fill="#26a641" />
        <rect x="47" y="3" width="16" height="16" rx="4" fill="#39d353" />
        <rect x="69" y="3" width="16" height="16" rx="4" fill="#006d32" />
        <rect x="91" y="3" width="16" height="16" rx="4" fill="#2ea043" />

        <rect x="3" y="25" width="16" height="16" rx="4" fill="#39d353" />
        <rect x="25" y="25" width="16" height="16" rx="4" fill="#0e4429" />
        <rect x="47" y="25" width="16" height="16" rx="4" fill="#2ea043" />
        <rect x="69" y="25" width="16" height="16" rx="4" fill="#39d353">
          <animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" repeatCount="indefinite" />
        </rect>
        <rect x="91" y="25" width="16" height="16" rx="4" fill="#26a641" />

        <rect x="3" y="47" width="16" height="16" rx="4" fill="#006d32" />
        <rect x="25" y="47" width="16" height="16" rx="4" fill="#39d353" />
        <rect x="47" y="47" width="16" height="16" rx="4" fill="#26a641" />
        <rect x="69" y="47" width="16" height="16" rx="4" fill="#0e4429" />
        <rect x="91" y="47" width="16" height="16" rx="4" fill="#7ee787">
          <animate attributeName="opacity" values="1;0.5;1" dur="4.2s" repeatCount="indefinite" />
        </rect>

        <rect x="3" y="69" width="16" height="16" rx="4" fill="#2ea043" />
        <rect x="25" y="69" width="16" height="16" rx="4" fill="#006d32" />
        <rect x="47" y="69" width="16" height="16" rx="4" fill="#39d353">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" />
        </rect>
        <rect x="69" y="69" width="16" height="16" rx="4" fill="#26a641" />
        <rect x="91" y="69" width="16" height="16" rx="4" fill="#0e4429" />

        <rect x="3" y="91" width="16" height="16" rx="4" fill="#26a641" />
        <rect x="25" y="91" width="16" height="16" rx="4" fill="#2ea043" />
        <rect x="47" y="91" width="16" height="16" rx="4" fill="#006d32" />
        <rect x="69" y="91" width="16" height="16" rx="4" fill="#7ee787" />
        <rect x="91" y="91" width="16" height="16" rx="4" fill="#39d353" />
      </g>
    </pattern>
    <path id="route" d="M46 214H152V170H260V105H370V188H490V78H610V145H728V94H854" />
  </defs>

  <rect width="900" height="280" rx="24" fill="url(#bg)" />
  <circle cx="190" cy="130" r="230" fill="url(#glow)" />
  <circle cx="760" cy="170" r="190" fill="#238636" opacity="0.08" filter="url(#softGlow)" />
  <rect x="28" y="28" width="844" height="224" rx="18" fill="url(#garden)" opacity="0.82" />
  <rect x="28" y="28" width="844" height="224" rx="18" fill="none" stroke="#7ee787" stroke-opacity="0.16" />

  <use href="#route" fill="none" stroke="#39d353" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.16" filter="url(#softGlow)" />
  <use href="#route" fill="none" stroke="url(#snake)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="17 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.25s" repeatCount="indefinite" />
  </use>

  <g filter="url(#headGlow)">
    <circle r="10" fill="#b6f7c2">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route" />
      </animateMotion>
    </circle>
    <circle r="3" cx="4" cy="-3" fill="#07120f">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route" />
      </animateMotion>
    </circle>
  </g>

  <rect x="1" y="1" width="898" height="278" rx="23" fill="none" stroke="#7ee787" stroke-opacity="0.2" />
</svg>
