<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Lan Luo</title>
  <desc id="desc">A midnight blue, violet, and cyan banner with stars and flowing waves.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070916" />
      <stop offset="0.48" stop-color="#17102e" />
      <stop offset="1" stop-color="#052533" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b38cff" />
      <stop offset="0.52" stop-color="#6ea8ff" />
      <stop offset="1" stop-color="#53e0e8" />
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#9a70ff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#9a70ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#45d9e8" stop-opacity="0.25" />
      <stop offset="1" stop-color="#45d9e8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c6d4ec" stroke-opacity="0.055" />
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <rect width="900" height="300" rx="26" fill="url(#background)" />
  <rect width="900" height="300" rx="26" fill="url(#grid)" />
  <circle cx="180" cy="105" r="215" fill="url(#violetGlow)" />
  <circle cx="760" cy="188" r="220" fill="url(#cyanGlow)" />

  <g fill="#d9dcff">
    <circle cx="585" cy="50" r="1.8" opacity="0.85" />
    <circle cx="650" cy="87" r="2.6" opacity="0.62" />
    <circle cx="720" cy="42" r="1.4" opacity="0.9" />
    <circle cx="812" cy="75" r="2.1" opacity="0.7" />
    <circle cx="850" cy="38" r="1.2" opacity="0.8" />
    <circle cx="783" cy="126" r="1.5" opacity="0.62" />
    <circle cx="610" cy="132" r="1.2" opacity="0.75" />
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M525 204C590 169 647 245 710 208C769 174 817 194 875 166" stroke="#55dce8" stroke-width="3" opacity="0.68" />
    <path d="M520 222C586 188 647 264 714 226C772 193 823 210 881 183" stroke="#829cff" stroke-width="2" opacity="0.38" />
    <path d="M542 239C604 215 657 278 725 243C776 217 829 227 872 207" stroke="#b68cff" stroke-width="1.4" opacity="0.25" />
  </g>

  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M600 77L664 115L729 80L795 128" opacity="0.24" />
    <path d="M664 115L704 162L795 128" opacity="0.15" />
  </g>
  <g fill="#83e5ee">
    <circle cx="600" cy="77" r="3.5" />
    <circle cx="664" cy="115" r="5" />
    <circle cx="729" cy="80" r="3.5" />
    <circle cx="795" cy="128" r="5.5" />
    <circle cx="704" cy="162" r="3" />
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="122" fill="#f6f3ff" font-size="61" font-weight="700" letter-spacing="7">LAN LUO</text>
    <text x="74" y="171" fill="url(#accent)" font-size="23" font-weight="600" letter-spacing="8">AI · RESEARCH · CREATION</text>
    <text x="75" y="217" fill="#b8c3da" font-size="16" letter-spacing="1.35">BETWEEN RIGOR AND IMAGINATION</text>
  </g>

  <rect x="1" y="1" width="898" height="298" rx="25" fill="none" stroke="#c6a7ff" stroke-opacity="0.23" />
</svg>
