<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Lan Luo</title>
  <desc id="desc">A minimal frosted glass profile banner in soft blue and violet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="0.55" stop-color="#182033" />
      <stop offset="1" stop-color="#101827" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.065" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.035" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36" />
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.11" />
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd" />
      <stop offset="1" stop-color="#7dd3fc" />
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.48" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.48" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="900" height="280" rx="26" fill="url(#background)" />

  <circle cx="165" cy="95" r="155" fill="url(#violetGlow)" filter="url(#blur)" />
  <circle cx="730" cy="205" r="180" fill="url(#blueGlow)" filter="url(#blur)" />
  <ellipse cx="520" cy="18" rx="185" ry="86" fill="#64748b" opacity="0.12" filter="url(#blur)" />

  <g filter="url(#shadow)">
    <rect x="54" y="42" width="792" height="196" rx="26" fill="url(#glass)" />
    <rect x="54.75" y="42.75" width="790.5" height="194.5" rx="25.25" fill="none" stroke="url(#border)" stroke-width="1.5" />
  </g>

  <path d="M81 69H817" stroke="#ffffff" stroke-opacity="0.09" />
  <circle cx="94" cy="82" r="4" fill="#c4b5fd" opacity="0.88" />
  <circle cx="110" cy="82" r="4" fill="#93c5fd" opacity="0.68" />
  <circle cx="126" cy="82" r="4" fill="#67e8f9" opacity="0.54" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="450" y="143" text-anchor="middle" fill="#f8fafc" font-size="60" font-weight="650" letter-spacing="9">LAN LUO</text>
    <rect x="295" y="167" width="310" height="34" rx="17" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="450" y="190" text-anchor="middle" fill="url(#accent)" font-size="15" font-weight="560" letter-spacing="3.4">RESEARCH · SYSTEMS · IMAGINATION</text>
  </g>

  <rect x="1" y="1" width="898" height="278" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.08" />
</svg>
