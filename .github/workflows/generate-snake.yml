name: Generate contribution animation

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0969da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Add blue glow to snake
        run: |
          perl -0pi -e 's~</style>~.s{filter:url(#blue-glow)}</style><defs><filter id="blue-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/><feFlood flood-color="#0969da" flood-opacity=".9" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>~' dist/github-contribution-grid-snake.svg
          perl -0pi -e 's~</style>~.s{filter:url(#blue-glow)}</style><defs><filter id="blue-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/><feFlood flood-color="#58a6ff" flood-opacity="1" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>~' dist/github-contribution-grid-snake-dark.svg

      - name: Publish animation to output branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "Update contribution animation"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
